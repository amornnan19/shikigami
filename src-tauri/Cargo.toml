[package]
name = "shikigami"
version = "0.1.0"
description = "Shikigami"
edition = "2021"
license-file = "../LICENSE"
publish = false

[lib]
name = "shikigami_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.6", features = [] }

[dependencies]
tauri = { version = "=2.12.7", features = [] }
tauri-plugin-opener = "=2.7.3"
tauri-plugin-wdio-webdriver = { version = "=1.5.1", optional = true }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
refinery = { version = "=0.10.0", features = ["rusqlite"] }
uuid = { version = "=1.29.3", features = ["v7"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
libc = "=0.2.191"
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["process", "time", "io-util", "macros", "rt"] }

[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[dev-dependencies]
tempfile = "=3.27.0"
